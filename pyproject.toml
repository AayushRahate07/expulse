[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "expulse"
version = "0.1.0"
description = "Multivariate Industrial Process Anomaly Detection on Tennessee Eastman Process"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Aayush Rahate" }
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "shap>=0.44.0",
    "pyreadr>=0.5.0",
    "pyarrow>=14.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "requests>=2.28.0",
    "tqdm>=4.65.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests"
]

[tool.setuptools.packages.find]
where = ["."]
